<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kehadiran Online - SKKM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--th:#f9fafb;--bl:#0b6fd6;--ok:#15803d;--okb:#dcfce7;--er:#b91c1c;--erb:#fee2e2;--wa:#a16207;--wab:#fef9c3}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111418;--card:#1b1f26;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d333d;--th:#222831;--okb:#12301c;--erb:#3b1616;--wab:#3a3210}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{background:var(--bl);color:#fff;padding:14px 5%;font-weight:600}
main{max-width:900px;margin:0 auto;padding:20px 18px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h2{margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:grid;gap:5px;font-size:13px;color:var(--mu)}
input{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--bl);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}button:disabled{opacity:.5}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px;font-size:14px}
th{background:var(--th);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 12px;border-top:1px solid var(--bd)}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
.ok{background:var(--okb);color:var(--ok)}.no{background:var(--erb);color:var(--er)}.wa{background:var(--wab);color:var(--wa)}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:14px}.msg.e{background:var(--erb);color:var(--er)}.msg.ok{background:var(--okb);color:var(--ok)}
.note{color:var(--mu);font-size:13px}
</style></head><body>
<header>Kehadiran Online (Zoom/Teams) · SKKM</header>
<main id="app"></main>
<script>
const SB_URL="https://eabcubayvkgtptvltihh.supabase.co",SB_KEY="sb_publishable_XAtElcShaCubfd2iz0OutQ_ccdXw4a8";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ev={name:"",pts:5,menit:30},rows=[],msg=null,busy=false;

function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
  const splitLine=l=>{const out=[];let cur="",q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(q){ if(c==='"'){ if(l[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
      else{ if(c==='"') q=true; else if(c===',' ){out.push(cur);cur=""} else cur+=c }}
    out.push(cur);return out.map(s=>s.trim())};
  const header=splitLine(lines[0]).map(h=>h.toLowerCase());
  const idx=name=>header.findIndex(h=>h.includes(name));
  const iName=idx("name")>=0?idx("name"):0;
  const iDur=header.findIndex(h=>h.includes("duration"));
  const iJoin=header.findIndex(h=>h.includes("join"));
  const iLeave=header.findIndex(h=>h.includes("leave")>=0?h.includes("leave"):h.includes("left"));
  return lines.slice(1).map(l=>{
    const c=splitLine(l);
    const rawName=c[iName]||"";
    let menit=null;
    if(iDur>=0){const v=parseFloat((c[iDur]||"").replace(",", "."));if(!isNaN(v))menit=Math.round(v)}
    else if(iJoin>=0&&iLeave>=0){const a=new Date(c[iJoin]),b=new Date(c[iLeave]);
      if(!isNaN(a)&&!isNaN(b))menit=Math.max(0,Math.round((b-a)/60000))}
    const m=rawName.match(/^\s*(\d{4,15})\s*[_\-\s]\s*(.+)$/);
    return {rawName, nim:m?m[1]:null, nama:m?m[2]:rawName, menit};
  });
}

async function onFile(file){
  msg=null;
  try{
    const text=await file.text();
    const parsed=parseCSV(text);
    if(!parsed.length){msg=["e","File tidak terbaca atau kosong."];render();return}
    // gabungkan baris dengan NIM sama, ambil durasi terbesar (join dari >1 device)
    const byNim=new Map();
    for(const r of parsed){
      if(!r.nim) continue;
      const prev=byNim.get(r.nim);
      if(!prev || (r.menit||0)>(prev.menit||0)) byNim.set(r.nim, r);
    }
    rows=[...parsed.filter(r=>!r.nim), ...byNim.values()].sort((a,b)=>(a.nim?0:1)-(b.nim?0:1));
  }catch(e){msg=["e","Gagal membaca file: "+e.message]}
  render();
}

async function proses(){
  busy=true;render();
  const eligible=rows.filter(r=>r.nim && (r.menit==null || r.menit>=ev.menit));
  let okCount=0, dup=0, err=0;
  for(const r of eligible){
    const code="ONLINE-"+ev.name.trim().toUpperCase().replace(/\s+/g,"_")+"-"+r.nim;
    const res=await sb.rpc("catat_kehadiran_online",{p_code:code,p_event:ev.name,p_pts:+ev.pts,p_nim:r.nim,p_menit:r.menit??0});
    if(res.error) err++; else if(res.data==="ok") okCount++; else dup++;
  }
  msg=["ok", `Selesai. Berhasil dicatat: ${okCount}. Sudah pernah tercatat: ${dup}. Gagal: ${err}.`];
  busy=false;render();
}

function rowStatus(r){
  if(!r.nim) return ["no","Nama tidak berformat NIM_Nama"];
  if(r.menit!=null && r.menit<ev.menit) return ["wa","Durasi kurang dari minimum"];
  return ["ok","Akan diberi poin"];
}

function showLogin(err){
  app.innerHTML=`<div class="card"><h2>Masuk Admin</h2><p class="sub">Khusus admin kemahasiswaan.</p>
   ${err?`<p class="msg e">${esc(err)}</p>`:""}
   <div class="f"><label>Email<input id="e" type="email"></label><label>Password<input id="p" type="password"></label><button id="b">Masuk</button></div></div>`;
  $("#b").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("#e").value,password:$("#p").value});
    r.error?showLogin(r.error.message):showMain()};
}

function showMain(){
  const m=msg?`<p class="msg ${msg[0]==='e'?'e':'ok'}">${esc(msg[1])}</p>`:"";
  const eligible=rows.filter(r=>r.nim && (r.menit==null || r.menit>=ev.menit)).length;
  app.innerHTML=`
  <div class="card"><h2>1. Detail Kegiatan</h2><p class="sub">Isi dulu sebelum unggah laporan kehadiran.</p>
   <div class="f">
    <label>Nama kegiatan<input id="en" value="${esc(ev.name)}" placeholder="Webinar Keamanan Siber"></label>
    <label>Poin<input id="ep" type="number" min="1" style="width:80px" value="${ev.pts}"></label>
    <label>Minimal hadir (menit)<input id="em" type="number" min="0" style="width:120px" value="${ev.menit}"></label>
   </div></div>

  <div class="card"><h2>2. Unggah Laporan Kehadiran</h2>
   <p class="sub">Ekspor dari Zoom (Reports &gt; Meeting &gt; Export with meeting data) atau Teams (ikon Attendance saat/habis meeting), lalu unggah file CSV-nya. Mahasiswa diminta mengganti nama tampilan menjadi format <b>NIM_NamaLengkap</b> sebelum bergabung, misalnya <code>240040078_Erik Bintang Bili</code>, supaya NIM terbaca otomatis.</p>
   <input type="file" id="file" accept=".csv">
   ${m}
   ${rows.length?`<div class="tw"><table><thead><tr><th>Nama di laporan</th><th>NIM</th><th>Menit hadir</th><th>Status</th></tr></thead><tbody>
     ${rows.map(r=>{const[s,t]=rowStatus(r);return `<tr><td>${esc(r.rawName)}</td><td>${r.nim?esc(r.nim):"-"}</td><td>${r.menit??"-"}</td><td><span class="st ${s}">${t}</span></td></tr>`}).join("")}
   </tbody></table></div>
   <p class="note" style="margin-top:10px">${eligible} dari ${rows.length} baris akan diberi poin.</p>
   <button id="go" ${busy||!eligible||!ev.name.trim()?"disabled":""}>${busy?"Memproses...":"Proses & Berikan Poin"}</button>`:""}
  </div>
  <button class="s" id="lo">Keluar</button>`;
  $("#en").oninput=e=>ev.name=e.target.value;
  $("#ep").oninput=e=>ev.pts=e.target.value;
  $("#em").oninput=e=>{ev.menit=+e.target.value||0;render()};
  $("#file").onchange=e=>e.target.files[0]&&onFile(e.target.files[0]);
  $("#lo").onclick=async()=>{await sb.auth.signOut();showLogin()};
  if($("#go")) $("#go").onclick=proses;
}

(async()=>{const s=await sb.auth.getSession();s.data.session?showMain():showLogin()})();
</script></body></html>
